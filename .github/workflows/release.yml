name: Build release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and smoke-test the packages but do not publish.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.format }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Building inside a distribution container pins the glibc the
    # package depends on to that distribution's release.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            arch: amd64
            runner: ubuntu-24.04
            image: debian:trixie
          - format: deb
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:trixie
          - format: rpm
            arch: x86_64
            runner: ubuntu-24.04
            image: rockylinux/rockylinux:10
          - format: rpm
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: rockylinux/rockylinux:10

    steps:
      # git must be present before checkout, otherwise actions/checkout
      # downloads a tarball and the man page date step has no history.
      - name: Install build dependencies (Debian)
        if: matrix.format == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential libpam0g-dev curl ca-certificates git

      - name: Install build dependencies (Rocky)
        if: matrix.format == 'rpm'
        run: dnf install -y gcc pam-devel curl ca-certificates git

      - uses: actions/checkout@v4

      - name: Install Rust
        # The Rocky image declares no PATH, so GITHUB_PATH would leave
        # later steps with only the added entry. Export the full PATH.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | bash

      - name: Install cargo-deb
        if: matrix.format == 'deb'
        run: cargo binstall -y cargo-deb

      - name: Install cargo-generate-rpm
        if: matrix.format == 'rpm'
        run: cargo binstall -y cargo-generate-rpm

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "Cargo.toml version $crate does not match tag $tag" >&2
            exit 1
          fi

      - name: Set man page date from the release commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          date="$(git log -1 --format=%cd --date=format:'%B %Y')"
          sed -i "s/^\(\.TH PWLDAPD 8 \)\"[^\"]*\"/\1\"$date\"/" pwldapd.8
          head -1 pwldapd.8

      - name: Build
        run: cargo build --release --locked

      - name: Build Debian package
        if: matrix.format == 'deb'
        run: |
          cargo deb --no-build
          ls -l target/debian/*.deb
          dpkg-deb --info target/debian/*.deb

      - name: Build RPM package
        if: matrix.format == 'rpm'
        run: |
          cargo generate-rpm
          ls -l target/generate-rpm/*.rpm
          rpm -qpi target/generate-rpm/*.rpm
          rpm -qp --requires target/generate-rpm/*.rpm

      - name: Collect package
        # A single flat directory so the artifact has no subdirectories.
        run: |
          mkdir -p dist
          if [ "${{ matrix.format }}" = deb ]; then
            cp target/debian/*.deb dist/
          else
            cp target/generate-rpm/*.rpm dist/
          fi
          ls -l dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  smoke:
    name: install ${{ matrix.format }} ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            arch: amd64
            runner: ubuntu-24.04
            image: debian:trixie
          - format: deb
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:trixie
          - format: rpm
            arch: x86_64
            runner: ubuntu-24.04
            image: rockylinux/rockylinux:10
          - format: rpm
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: rockylinux/rockylinux:10

    steps:
      - name: Install test dependencies (Debian)
        if: matrix.format == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3

      - name: Install test dependencies (Rocky)
        if: matrix.format == 'rpm'
        run: dnf install -y git ca-certificates python3

      - uses: actions/checkout@v4
        with:
          sparse-checkout: pkg/ci

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.format }}-${{ matrix.arch }}
          path: dist

      - name: List downloaded package
        run: ls -l dist

      - name: Install package (Debian)
        if: matrix.format == 'deb'
        run: apt-get install -y --no-install-recommends ./dist/*.deb

      - name: Install package (Rocky)
        if: matrix.format == 'rpm'
        # Container images set tsflags=nodocs; clear it so the man page,
        # which is marked %doc, is installed and can be checked below.
        run: dnf --setopt=tsflags= install -y ./dist/*.rpm

      - name: Verify installed files
        run: |
          id pwldapd
          test -x /usr/sbin/pwldapd
          test -f /etc/pam.d/pwldapd
          # cargo-deb gzips the man page; cargo-generate-rpm does not.
          test -f /usr/share/man/man8/pwldapd.8 \
            || test -f /usr/share/man/man8/pwldapd.8.gz
          test -f /usr/lib/systemd/system/pwldapd.service
          /usr/sbin/pwldapd --version

      - name: Run the daemon and query it
        run: |
          /usr/sbin/pwldapd -c pkg/ci/smoke.toml &
          pid=$!
          sleep 2
          python3 -I pkg/ci/smoke_client.py 127.0.0.1 3389 dc=smoke,dc=test
          kill -TERM "$pid"
          wait "$pid"

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -l dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true

  publish-repo:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates gnupg reprepro createrepo-c rpm

      - uses: actions/checkout@v4

      - name: Check for signing key
        id: key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -n "$APT_SIGNING_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APT_SIGNING_KEY secret not set; skipping repository publish"
          fi

      - name: Import signing key
        if: steps.key.outputs.present == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Check out gh-pages
        if: steps.key.outputs.present == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git fetch origin gh-pages; then
            git worktree add site FETCH_HEAD
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq . 2>/dev/null || true
          fi

      - name: Update repositories
        if: steps.key.outputs.present == 'true'
        run: pkg/apt/publish.sh site dist

      - name: Push gh-pages
        if: steps.key.outputs.present == 'true'
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish packages for ${GITHUB_REF_NAME}" \
            || { echo "nothing to publish"; exit 0; }
          git push origin gh-pages
