[package]
name = "pwldapd"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "LDAP daemon backed by system accounts"
license = "GPL-3.0-only"

[[bin]]
name = "pwldapd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
libc = "0.2"
pam = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
proptest = "1"
rcgen = "0.13"
tokio = { version = "1", features = ["test-util"] }

[package.metadata.deb]
maintainer = "Michael Paddon <michael@paddon.org>"
copyright = "2026 Michael Paddon <michael@paddon.org>"
license-file = ["LICENSE", "0"]
extended-description = """\
A read-only LDAP server (RFC 4510) that exposes the local POSIX user and \
group database over the LDAP protocol. Bind requests are authenticated via \
PAM. Anonymous binds are accepted. TLS (LDAPS) is supported.\
"""
depends = "$auto, libpam-runtime, adduser"
recommends = "libcap2-bin"
section = "net"
priority = "optional"
conf-files = ["/etc/pam.d/pwldapd"]
maintainer-scripts = "pkg/deb/"
systemd-units = { unit-name = "pwldapd", unit-scripts = "pkg/deb/", enable = true }
assets = [
    { source = "target/release/pwldapd", dest = "usr/sbin/pwldapd", mode = "0755" },
    { source = "pwldapd.8", dest = "usr/share/man/man8/pwldapd.8", mode = "0644" },
    { source = "pkg/deb/pwldapd.pam", dest = "etc/pam.d/pwldapd", mode = "0644" },
]

[package.metadata.generate-rpm]
summary = "LDAP daemon backed by local POSIX accounts"
license = "GPLv3"
url = "https://github.com/6d7770/pwldapd"
assets = [
    { source = "target/release/pwldapd", dest = "/usr/sbin/pwldapd", mode = "755" },
    { source = "pwldapd.8", dest = "/usr/share/man/man8/pwldapd.8", mode = "644", doc = true },
    { source = "pkg/rpm/pwldapd.pam", dest = "/etc/pam.d/pwldapd", mode = "644", config = "noreplace" },
    { source = "pkg/rpm/pwldapd.service", dest = "/usr/lib/systemd/system/pwldapd.service", mode = "644" },
]
# cargo-generate-rpm writes the package directly, so RPM macros such as
# %systemd_post are not available; the scriptlets are plain shell.
pre_install_script = """
if ! getent group pwldapd >/dev/null; then
    groupadd -r pwldapd
fi
if ! getent passwd pwldapd >/dev/null; then
    useradd -r -g pwldapd -d / -s /sbin/nologin -c "pwldapd daemon" pwldapd
fi
"""
post_install_script = """
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload >/dev/null 2>&1 || :
    if [ "$1" -eq 1 ]; then
        systemctl enable pwldapd.service >/dev/null 2>&1 || :
    fi
fi
"""
pre_uninstall_script = """
if [ "$1" -eq 0 ] && [ -d /run/systemd/system ]; then
    systemctl --no-reload disable pwldapd.service >/dev/null 2>&1 || :
    systemctl stop pwldapd.service >/dev/null 2>&1 || :
fi
"""
post_uninstall_script = """
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload >/dev/null 2>&1 || :
    if [ "$1" -ge 1 ]; then
        systemctl try-restart pwldapd.service >/dev/null 2>&1 || :
    fi
fi
if [ "$1" -eq 0 ]; then
    userdel pwldapd >/dev/null 2>&1 || :
    groupdel pwldapd >/dev/null 2>&1 || :
fi
"""

[package.metadata.generate-rpm.requires]
pam = "*"
shadow-utils = "*"
systemd = "*"
